<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AICF Kernel Lab</title>

  <link rel="stylesheet" href="../../shared/styles/base.css" />
  <link rel="stylesheet" href="../../shared/styles/layout.css" />
  <link rel="stylesheet" href="../../shared/styles/inspector.css" />
  <link rel="stylesheet" href="../../shared/styles/output.css" />
  <link rel="stylesheet" href="styles/kernellab.css" />
</head>


<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">⬛</span>
      <div>
        <div class="title">AICF Kernel Lab</div>
        <div class="subtitle">Kernel library • optimization notes • benchmarks (manual-first)</div>
      </div>
    </div>

    <div class="topbar-actions">
      <a class="btn" href="../graph/index.html">Back</a>

      <button id="btnNewKernel" class="btn">New Kernel</button>
      <button id="btnExport" class="btn">Export</button>
      <button id="btnImport" class="btn">Import</button>
      <button id="btnReset" class="btn danger">Reset</button>
      <input id="fileImport" type="file" accept="application/json" style="display:none;" />
    </div>
  </header>

  <main class="layout">
    <!-- Left: Catalog -->
    <section class="pane left">
      <div class="section-head">
        <h2>Catalog</h2>
        <div class="hint">커널 단위로 정리 (compile과 무관)</div>
      </div>

      <div class="row">
        <input id="q" class="search" placeholder="Search: bias_add / gemm / reduce ..." />
      </div>

      <div id="catalog" class="catalog"></div>
    </section>

    <!-- Middle: Blocks -->
    <section class="pane middle">
      <div class="section-head">
        <h2>Kernel</h2>
        <div id="kmeta" class="hint">Select a kernel</div>
      </div>

      <div id="blocks" class="blocks"></div>
    </section>

    <!-- Right: Inspector -->
    <section class="pane right">
      <div class="section-head">
        <h2>Inspector</h2>
        <div class="hint">블록 선택 → 여기서 기록/수정</div>
      </div>

      <div id="inspector" class="inspector empty">왼쪽에서 커널 선택 후 블록을 클릭해.</div>

      <h2 style="margin-top:16px;">Quick View</h2>
      <div id="quick" class="output">
        <div class="panel">대표 결과/결론을 여기에 요약 표시</div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>Kernel Lab • localStorage • key=rb_kernellab_v1</span>
  </footer>

  <script type="module" src="js/kernellab_app.js"></script>
</body>
</html>
